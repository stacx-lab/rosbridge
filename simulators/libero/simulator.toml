name = "libero"
source = "third_party/libero"
source_url = "https://github.com/Lifelong-Robot-Learning/LIBERO.git"
source_revision = "8f1084e3132a39270c3a13ebe37270a43ece2a01"
patches = "patches/libero"
python_path = "simulators/libero"
asset_preparer = "rosbridge_libero.assets:prepare"
default_task = "libero-spatial-01"
ros_package = "rosbridge_libero"
environment = "libero"
task_catalog = "tasks.toml"
asset_checker = "rosbridge_libero.assets:check_task"

# The backend's device inventory; catalog rigs must declare exactly these devices.
[devices]
arm = "joint"
gripper = "gripper"
camera_agentview = "rgb"
camera_wrist = "rgb"

# Alternative device sets: setup, launch and demo select one with --config NAME (default: [devices] above).
# devices overrides kinds in [devices]; each rig holds configurations/NAME/ with its profile changes
# (profiles.yaml); the backend takes configuration=NAME.
[configurations.osc]
description = "The arm takes flange pose targets that upstream's OSC_POSE controller executes, as LIBERO's policies are trained"
devices = {}  # the arm stays a joint device; it takes pose targets instead of joint targets
