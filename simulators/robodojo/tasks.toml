# RoboDojo simulation tasks on the dual ARX X5 rig with saved evaluation layouts, as
# cataloged by RoboEnv (the *_random variants are excluded). Three competition tasks
# (imitate_sorting_sequence, make_kong, play_tic_tac_toe) add a Franka support arm
# that the native environment drives; it is not a device.

