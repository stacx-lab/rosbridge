name = "robodojo"
source = "third_party/robodojo"
source_url = "https://github.com/RoboDojo-Benchmark/RoboDojo.git"
source_revision = "cb2a37d58dbbeb2777b0c2b30e97ecb8ab91095c"
patches = "patches/robodojo"
python_path = "simulators/robodojo"
# RoboDojo is imported from the generated tree; its forks are editable installs.
install = []
asset_preparer = "rosbridge_robodojo.assets:prepare"
asset_checker = "rosbridge_robodojo.assets:check_task"
default_task = "pack_objects_into_box"
ros_package = "rosbridge_robodojo"
task_catalog = "tasks.toml"
# The world node runs in the ROS environment; Isaac Sim 5.1 (Python 3.11) runs the
# native backend in a separate worker process (rosbridge.core.worker).
environment = "robodojo"
native_environment = "robodojo-native"
native_backend = "rosbridge_robodojo.backend:RoboDojoSim"

# RoboDojo's git submodules, pinned and exported into the generated tree.
[[nested_sources]]
path = "third_party/IsaacLab"
source = "third_party/robodojo-isaaclab"
source_url = "https://github.com/yuechen0614/IsaacLab.git"
source_revision = "afca7b09d60d8beb9c1cb28b43066499940b969b"
install = ["source/isaaclab", "source/isaaclab_assets", "source/isaaclab_tasks"]

[[nested_sources]]
path = "third_party/curobo"
source = "third_party/robodojo-curobo"
source_url = "https://github.com/yuechen0614/curobo.git"
source_revision = "895c6517243f8cb091c73c018c8167192d39599a"
install = ["."]
# setuptools-scm cannot read a version from the exported tree.
build_environment = { SETUPTOOLS_SCM_PRETEND_VERSION_FOR_NVIDIA_CUROBO = "0.0.post1.dev1+g895c651" }

# The backend's device inventory; catalog rigs must declare exactly these devices.
[devices]
left_arm = "joint"
left_gripper = "gripper"
right_arm = "joint"
right_gripper = "gripper"
head_camera = "rgb"
left_camera = "rgb"
right_camera = "rgb"
