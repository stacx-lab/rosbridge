name = "robotwin"
source = "third_party/robotwin"
source_url = "https://github.com/RoboTwin-Platform/RoboTwin.git"
source_revision = "ea8b21121ebb3cd201ff5b3fe361944ac94eda3f"
patches = "patches/robotwin"
python_path = "simulators/robotwin"
# RoboTwin is a source tree, not an installable package; the backend imports it in place.
install = []
asset_preparer = "rosbridge_robotwin.assets:prepare"
asset_checker = "rosbridge_robotwin.assets:check_task"
default_task = "handover_block"
ros_package = "rosbridge_robotwin"
environment = "robotwin"
task_catalog = "tasks.toml"

# The backend's device inventory; catalog rigs must declare exactly these devices.
[devices]
left_arm = "joint"
left_gripper = "gripper"
right_arm = "joint"
right_gripper = "gripper"
head_camera = "rgbd"
left_camera = "rgbd"
right_camera = "rgbd"
