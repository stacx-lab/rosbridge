name = "handson"
source = "third_party/handson"
source_url = "https://github.com/TsinghuaC3I/HandsOn.git"
source_revision = "fee28452fa50d3ee906445f1717ce2449cc83798"
patches = "patches/handson"
python_path = "simulators/handson"
# The installable package and its bundled assets live in the repository's handson/ directory.
install = ["handson"]
asset_preparer = "rosbridge_handson.assets:prepare"
asset_checker = "rosbridge_handson.assets:check_task"
default_task = "t24_place_ball_in_bowl"
ros_package = "rosbridge_handson"
task_catalog = "tasks.toml"
# The world node runs in the ROS environment; Isaac Sim 5.1 and Isaac Lab (Python 3.11) run the
# native backend in a separate worker process (rosbridge.core.worker).
environment = "handson"
native_environment = "handson-native"
native_backend = "rosbridge_handson.backend:HandsOnSim"

# Isaac Lab v2.3.2, the release HandsOn's PhysX evaluator requires; installed without dependencies.
[[nested_sources]]
path = "third_party/IsaacLab"
source = "third_party/handson-isaaclab"
source_url = "https://github.com/isaac-sim/IsaacLab.git"
source_revision = "37ddf626871758333d6ed89cf64ad702aef127d0"
install = ["source/isaaclab"]

# The backend's device inventory; catalog rigs must declare exactly these devices.
[devices]
right_arm = "joint"
right_hand = "joint"
left_arm = "joint"
left_hand = "joint"
head_camera = "rgb"
left_camera = "rgb"
right_camera = "rgb"
