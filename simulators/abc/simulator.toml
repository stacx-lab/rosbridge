name = "abc"
source = "third_party/abc"
source_url = "https://github.com/amazon-far/abc.git"
source_revision = "d0832d12651d1b260a652861a14648dc5f3660c7"
patches = "patches/abc"
python_path = "simulators/abc"
asset_preparer = "rosbridge_abc.assets:prepare"
default_task = "put_plastic_bottles_in_bin"
ros_package = "rosbridge_abc"
environment = "abc"
task_catalog = "tasks.toml"
asset_checker = "rosbridge_abc.assets:check_task"

# The backend's device inventory; catalog rigs must declare exactly these devices.
[devices]
left_arm = "joint"
left_gripper = "gripper"
right_arm = "joint"
right_gripper = "gripper"
camera_top = "rgbd"
camera_left = "rgbd"
camera_right = "rgbd"
