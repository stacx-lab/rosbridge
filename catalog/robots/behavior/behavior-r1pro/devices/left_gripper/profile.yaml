name: left_gripper
runtime:
  domain_id: 0
  observation: joint_state
  nodes: []
  ready_timeout_s: 30
operations:
  joint_state:
    description: The smooth command the mean finger opening reaches, -1 (closed) to 1 (open),
      stamped at acquisition; the URDF finger links follow it.
    transport: topic
    direction: output
    endpoint: /left_gripper/joint_state
    type: sensor_msgs/msg/JointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  target:
    description: Smooth native gripper command (data) from -1 (closed) to 1 (open), held until
      replaced or stopped; out-of-range targets are ignored, so verify joint_state.
    transport: topic
    direction: input
    endpoint: /left_gripper/target
    type: std_msgs/msg/Float64
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  stop:
    description: Stop and keep the active grip target; a held object stays gripped. Before
      the first command it holds the opening at reset. Command an open target to release.
    transport: service
    direction: input
    endpoint: /left_gripper/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
loaded: false
