name: right_arm
runtime:
  domain_id: 0
  nodes:
  - entry: links.py
    factory: create
  ready_timeout_s: 30
operations:
  joint_state:
    description: Measured positions of right_joint1, right_joint2, right_joint3, right_joint4,
      right_joint5, right_joint6 in radians with velocities and the world-clock acquisition
      stamp; do not infer motion completion from a sent command.
    transport: topic
    direction: output
    endpoint: /right_arm/joint_state
    type: sensor_msgs/msg/JointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  joint_target:
    description: Joint trajectory over all 6 arm joints in radians, timed from receipt by
      strictly increasing time_from_start and finishing within 120 seconds; velocities, accelerations
      and effort must be empty. A zero header stamp selects now; a nonzero stamp must not
      start in the past. Points are absolute native joint positions, linearly interpolated
      at the native control period. Replacement clears pending references; invalid trajectories
      are ignored, so verify measured joint_state.
    transport: topic
    direction: input
    endpoint: /right_arm/joint_target
    type: trajectory_msgs/msg/JointTrajectory
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  stop:
    description: Stop arm motion and hold the measured posture.
    transport: service
    direction: input
    endpoint: /right_arm/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
loaded: false
meta:
  created_at: '2026-10-24T00:00:00Z'
  updated_at: '2026-10-24T00:00:00Z'
type: joint
description: YAM six-joint right arm of the ABC station. Geometry is the sibling arm.urdf
  with flange (link_6) as the tip link; measured links are on TF as right_arm/<link>, and
  helpers.joint_model('right_arm') computes FK/IK from it. Commands are the native absolute
  joint positions of upstream's 14-D policy action; rosbridge rejects targets outside the
  native joint ranges.
