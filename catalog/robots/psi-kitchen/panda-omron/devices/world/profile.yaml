name: world
runtime:
  domain_id: 0
  observation: time
  nodes: []
  ready_timeout_s: 30
operations:
  time:
    description: Authoritative world clock
    transport: topic
    direction: output
    endpoint: /clock
    type: rosgraph_msgs/msg/Clock
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  wait:
    description: Let the robot run for duration_s seconds of robot time (finite and nonnegative). Zero
      is an observation barrier. Waits are sequential; one requested while another is pending
      is rejected. Once the task attempt has ended, further waits are rejected.
    transport: service
    direction: input
    endpoint: /world/wait
    type: kinex_interfaces/srv/Wait
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 120
  stop:
    description: Cancel the pending wait.
    transport: service
    direction: input
    endpoint: /world/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  reset:
    description: Restart the task from its start, when the operator allows it (otherwise it fails
      and nothing changes).
    transport: service
    direction: input
    endpoint: /world/reset
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 120
loaded: false
meta:
  created_at: '2026-10-24T00:00:00Z'
  updated_at: '2026-10-24T00:00:00Z'
type: world
description: Clock of the robot's workspace. Kitchen fixtures and objects are not
  devices; the mobile robot is not localized in this frame. This device exposes no task instructions
  or evaluator results.
