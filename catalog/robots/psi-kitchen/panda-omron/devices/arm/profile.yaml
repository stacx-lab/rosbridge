name: arm
runtime:
  domain_id: 0
  nodes:
  - entry: links.py
    factory: create
  ready_timeout_s: 30
operations:
  joint_state:
    description: Measured positions of robot0_joint1, robot0_joint2, robot0_joint3, robot0_joint4,
      robot0_joint5, robot0_joint6, robot0_joint7 in radians with velocities and the world-clock
      acquisition stamp; do not infer motion completion from a sent command.
    transport: topic
    direction: output
    endpoint: /arm/joint_state
    type: sensor_msgs/msg/JointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  joint_target:
    description: Joint trajectory over all 7 arm joints in radians, timed from receipt by
      strictly increasing time_from_start and finishing within 120 seconds; velocities, accelerations
      and effort must be empty. A zero header stamp selects now; a nonzero stamp must not
      start in the past. Points are absolute joint positions, linearly interpolated
      at the 20 Hz control period. Replacement clears pending references; invalid trajectories
      are ignored, so verify measured joint_state.
    transport: topic
    direction: input
    endpoint: /arm/joint_target
    type: trajectory_msgs/msg/JointTrajectory
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  stop:
    description: Stop arm motion and hold the measured posture.
    transport: service
    direction: input
    endpoint: /arm/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
loaded: false
meta:
  created_at: '2026-10-24T00:00:00Z'
  updated_at: '2026-10-24T00:00:00Z'
type: joint
description: Franka Panda seven-joint arm on the torso. Geometry is the sibling arm.urdf with
  flange as the tip link; measured links are on TF as arm/<link>, and helpers.joint_model('arm')
  computes FK/IK from it. Commands are absolute joint positions; the robot rejects
  targets outside the joint ranges.
