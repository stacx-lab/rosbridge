name: right_arm
runtime:
  domain_id: 0
  nodes:
  - entry: links.py
    factory: create
  ready_timeout_s: 30
operations:
  joint_state:
    description: Measured positions of right_shoulder_pitch_joint, right_shoulder_roll_joint,
      right_shoulder_yaw_joint, right_elbow_joint, right_wrist_roll_joint, right_wrist_pitch_joint,
      right_wrist_yaw_joint in radians with velocities and the world-clock acquisition stamp;
      do not infer motion completion from a sent command.
    transport: topic
    direction: output
    endpoint: /right_arm/joint_state
    type: sensor_msgs/msg/JointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  joint_target:
    description: Joint trajectory over all 7 arm joints in radians, timed from receipt by
      strictly increasing time_from_start and finishing within 120 seconds; velocities, accelerations
      and effort must be empty. A zero header stamp selects now; a nonzero stamp must not
      start in the past. Points are absolute native joint positions, linearly interpolated
      at the native control period. Replacement clears pending references. A target beyond a joint's limits
      is clipped to the limit; other invalid trajectories are ignored, so verify measured joint_state.
    transport: topic
    direction: input
    endpoint: /right_arm/joint_target
    type: trajectory_msgs/msg/JointTrajectory
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  stop:
    description: Stop arm motion and hold the measured posture.
    transport: service
    direction: input
    endpoint: /right_arm/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
loaded: false
meta:
  created_at: '2026-10-24T00:00:00Z'
  updated_at: '2026-10-24T00:00:00Z'
type: joint
description: G1 seven-joint right arm on the torso. Geometry is the sibling arm.urdf with
  flange (right_wrist_yaw_link) as the tip link; measured links are on TF as right_arm/<link>,
  and helpers.joint_model('right_arm') computes FK/IK from it. Commands are absolute native
  joint positions on GR00T's arm gains.
source: introspected
calibrated_at: null
method: introspection
model:
  format: urdf
  path: arm.urdf
  base_link: base_link
  tip_link: flange
limits: native
home:
  right_shoulder_pitch_joint: 0.0
  right_shoulder_roll_joint: -0.2
  right_shoulder_yaw_joint: 0.0
  right_elbow_joint: 0.0
  right_wrist_roll_joint: 0.0
  right_wrist_pitch_joint: 0.0
  right_wrist_yaw_joint: 0.0
stop:
  behavior: hold
  affected_devices:
  - right_arm
frames:
  base:
    translation_m:
    - 0.0
    - 0.0
    - 0.0
    rotation_xyzw:
    - 0.0
    - 0.0
    - 0.0
    - 1.0
    parent: torso:top
