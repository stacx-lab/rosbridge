name: torso
runtime:
  domain_id: 0
  nodes:
  - entry: links.py
    factory: create
  ready_timeout_s: 30
operations:
  joint_state:
    description: Measured positions of waist_yaw_joint, waist_roll_joint, waist_pitch_joint
      in radians with velocities and the world-clock acquisition stamp; do not infer motion
      completion from a sent command.
    transport: topic
    direction: output
    endpoint: /torso/joint_state
    type: sensor_msgs/msg/JointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  joint_target:
    description: Joint trajectory over all 3 waist joints in radians, timed from receipt by
      strictly increasing time_from_start and finishing within 120 seconds; velocities, accelerations
      and effort must be empty. A zero header stamp selects now; a nonzero stamp must not
      start in the past. Points are absolute native joint positions, linearly interpolated
      at the native control period. Replacement clears pending references. A target beyond a joint's limits
      is clipped to the limit; other invalid trajectories are ignored, so verify measured joint_state.
    transport: topic
    direction: input
    endpoint: /torso/joint_target
    type: trajectory_msgs/msg/JointTrajectory
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  stop:
    description: Stop waist motion and hold the measured posture.
    transport: service
    direction: input
    endpoint: /torso/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
loaded: false
meta:
  created_at: '2026-10-24T00:00:00Z'
  updated_at: '2026-10-24T00:00:00Z'
type: joint
description: G1 three-joint waist (yaw, roll, pitch) on the pelvis; its base frame is the pelvis link
  pelvis/pelvis, which carries the measured pelvis tilt (the pelvis device), so the TF poses of the torso, arms,
  hands and head camera include it. Geometry is the sibling torso.urdf with top (torso_link), where the arms and
  head camera mount, as its tip link.
  Targets set the torso orientation that GR00T's lower-body policy tracks while it balances,
  so verify the measured joint_state. Standing with an arm reaching forward, a waist pitch near its 0.52 limit is not
  held; the body settles either leaning back with the waist near 0.25 or forward at 0.52, and can switch after several
  seconds; with the pelvis at 0.60 a 0.52 target reaches only 0.20-0.34. Standing (pelvis 0.74), leaning the waist
  forward adds reach once the measured waist pitch has settled at its target; the palm reaches 0.50 m ahead of the point
  midway between the ankles with the waist at 0, 0.60 m at 0.3 and 0.66 m at 0.52 (at hand heights of 0.95-1.15 m). In
  a squat (pelvis 0.45 and below) the waist
  settles behind its target while the pelvis pitches forward (a target of 0 at -0.39 to -0.16, 0.3 at 0.08 to 0.18
  and 0.52 at 0.15 to 0.25; only an arm raised overhead brings it to 0.52), so in a squat the waist adds little reach.
