name: world
runtime:
  domain_id: 0
  observation: time
  nodes: []
  ready_timeout_s: 30
operations:
  time:
    description: Authoritative world clock
    transport: topic
    direction: output
    endpoint: /clock
    type: rosgraph_msgs/msg/Clock
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  wait:
    description: Advance or await duration_s of world time (finite and nonnegative). Zero
      is an observation barrier. Waits are sequential; one requested while another is pending
      is rejected. A terminal episode rejects further progression without exposing benchmark
      results; it states the world time of the end instead (a pending wait answers "episode ended
      during wait; the episode ended at world time T s", a later one "the episode ended at world
      time T s"), so an end before the episode's time limit tells an early end from running out of
      time. A world step that runs a cooking, slicing or dicing transition can take minutes of wall
      time while world time stands still; a wait that times out then has not lost the world, so
      wait again.
    transport: service
    direction: input
    endpoint: /world/wait
    type: kinex_interfaces/srv/Wait
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 120
  stop:
    description: Cancel the pending wait.
    transport: service
    direction: input
    endpoint: /world/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  reset:
    description: Reset the configured episode and clock. Invalidates old observations and
      the pending wait; observe fresh state afterward. Task selection and judging belong to
      the external environment operator; a reset ends the current episode, which is judged
      as it stands.
    transport: service
    direction: input
    endpoint: /world/reset
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 120
loaded: false
