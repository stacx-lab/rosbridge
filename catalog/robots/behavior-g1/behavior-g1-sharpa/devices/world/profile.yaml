name: world
runtime:
  domain_id: 0
  observation: time
  nodes: []
  ready_timeout_s: 30
operations:
  time:
    description: Authoritative world clock
    transport: topic
    direction: output
    endpoint: /clock
    type: rosgraph_msgs/msg/Clock
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  wait:
    description: Advance or await duration_s of world time (finite and nonnegative). Zero
      is an observation barrier. Waits are sequential; one requested while another is pending
      is rejected. A terminal episode rejects further progression without exposing benchmark
      results.
    transport: service
    direction: input
    endpoint: /world/wait
    type: kinex_interfaces/srv/Wait
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 120
  stop:
    description: Cancel the pending wait.
    transport: service
    direction: input
    endpoint: /world/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  reset:
    description: Reset the configured episode and clock. Invalidates old observations and
      the pending wait; observe fresh state afterward. Task selection and judging belong to
      the external environment operator; a reset ends the current episode, which is judged
      as it stands.
    transport: service
    direction: input
    endpoint: /world/reset
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 120
loaded: false
