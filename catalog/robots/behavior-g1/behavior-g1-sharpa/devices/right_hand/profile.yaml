name: right_hand
runtime:
  domain_id: 0
  nodes:
  - entry: links.py
    factory: create
  ready_timeout_s: 30
operations:
  joint_state:
    description: Measured positions of right_thumb_CMC_FE, right_thumb_CMC_AA, right_thumb_MCP_FE,
      right_thumb_MCP_AA, right_thumb_IP, right_index_MCP_FE, right_index_MCP_AA, right_index_PIP,
      right_index_DIP, right_middle_MCP_FE, right_middle_MCP_AA, right_middle_PIP, right_middle_DIP,
      right_ring_MCP_FE, right_ring_MCP_AA, right_ring_PIP, right_ring_DIP, right_pinky_CMC,
      right_pinky_MCP_FE, right_pinky_MCP_AA, right_pinky_PIP, right_pinky_DIP in radians
      with velocities and the world-clock acquisition stamp; do not infer motion completion
      from a sent command.
    transport: topic
    direction: output
    endpoint: /right_hand/joint_state
    type: sensor_msgs/msg/JointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  joint_target:
    description: Joint trajectory over all 22 hand joints in radians, timed from receipt by
      strictly increasing time_from_start and finishing within 120 seconds; velocities, accelerations
      and effort must be empty. A zero header stamp selects now; a nonzero stamp must not
      start in the past. Points are absolute native joint positions, linearly interpolated
      at the native control period. Replacement clears pending references. A target beyond a joint's limits
      is clipped to the limit; any other invalid trajectory
      (one without points, say) is refused (nothing of it is executed), and the reply to the next world wait names the device and the reason; verify measured joint_state.
    transport: topic
    direction: input
    endpoint: /right_hand/joint_target
    type: trajectory_msgs/msg/JointTrajectory
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  attachment:
    description: What the hand holds under assisted grasping, latched and republished whenever it changes - none,
      held (an object fixed to the hand, which moves with it) or tethered (a part on a hinge or slide of its object,
      such as a door, drawer or lid, attached through a pivot); attached_object names it. Always none under physical
      grasping, where nothing attaches.
    transport: topic
    direction: output
    endpoint: /right_hand/attachment
    type: std_msgs/msg/String
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  attached_object:
    description: What the hand is attached to under assisted grasping, as <object>/<link> (the object's name in the
      world, then the link the attachment holds, such as base_link for a loose object or a door's own link), latched
      and republished whenever it changes; none whenever attachment is none.
    transport: topic
    direction: output
    endpoint: /right_hand/attached_object
    type: std_msgs/msg/String
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  stop:
    description: Stop hand motion and hold the measured posture.
    transport: service
    direction: input
    endpoint: /right_hand/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
loaded: false
