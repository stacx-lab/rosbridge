name: base
runtime:
  domain_id: 0
  observation: odometry
  nodes:
  - entry: odom.py
    factory: create
  ready_timeout_s: 30
operations:
  velocity:
    description: Body velocity in base/base axes as linear.x (vx), linear.y (vy), angular.z
      (wz), in m/s and rad/s within the declared bounds; other fields must be zero. The body
      follows the latest twist and stops 0.5 s of world time after the last one, so re-send
      to keep moving. A component beyond its bound is clipped to it; a twist with other nonzero
      fields is ignored, so verify with odometry.
    transport: topic
    direction: input
    endpoint: /base/velocity
    type: geometry_msgs/msg/Twist
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  odometry:
    description: Measured body twist in base/base (m/s and rad/s at the body origin) and the
      planar pose (x, y, yaw) in base/odom, the body frame at episode start; never a global pose.
      The pose is also on TF as base/odom -> base/base. It is the simulator's own pose of the body,
      current at every step and exact (no drift, delay or noise).
    transport: topic
    direction: output
    endpoint: /base/odometry
    type: nav_msgs/msg/Odometry
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  fall:
    description: upright, or fallen once the body has fallen (latched, republished when it changes); after a fall
      the body does not walk again within the episode, whatever twist is sent.
    transport: topic
    direction: output
    endpoint: /base/fall
    type: std_msgs/msg/String
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  stop:
    description: Command zero velocity.
    transport: service
    direction: input
    endpoint: /base/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
loaded: false
meta:
  created_at: '2026-10-24T00:00:00Z'
  updated_at: '2026-10-24T00:00:00Z'
type: locomotion
description: Unitree G1 legs walking on GR00T WholeBodyControl's balance and walking policies,
  which own the legs and waist at 50 Hz. Commands are a body twist (vx, vy in m/s, wz in rad/s)
  within GR00T's navigation limits of 0.5; the gait balances the body while the arms and hands
  move. A twist whose norm sqrt(vx^2 + vy^2 + wz^2) is below 0.1 takes no step at all (GR00T then runs its
  standing policy), so a slowing final approach stalls short of its goal; from 0.1 up the body moves at about
  0.7 of vx (0.1 m/s gives 0.07, 0.3 gives 0.2), 0.6 to 0.9 of vy and 0.85 to 1.1 of wz. The base frame base/base is at the pelvis, level, with the pelvis's heading; odometry
  starts at the episode-start pose and is on TF (base/odom -> base/base). Odometry is planar, so
  base/base keeps its episode-start height in base/odom, also while the pelvis is lowered (in a
  squat, base/odom heights are off by the drop). The pelvis device has the pelvis height above
  the floor (pelvis/floor) and its tilt (pelvis/pelvis, which the torso and everything on it
  follow). The legs walk only with the pelvis at 0.70 m or higher (the pelvis device); lower, a
  twist does not move the body. Heights in other devices' frames are relative to the pelvis. The
  balance policy steps rather than braces; pushing on furniture or objects with more than about
  20-30 N makes the body step away and turn. A fall is not recovered within the episode; once the pelvis has
  spent 1 s in all tilted more than 45 degrees from upright or below 0.15 m above the floor (since it was last back
  within 30 degrees of upright), the legs and waist hold still until the episode ends (GR00T's policies slid fallen
  bodies across the floor), twists are ignored, and fall reads fallen; the arms and hands still follow their
  commands. Normal postures stay within about 33 degrees (squats, reaching, walking). Heading can be set to about
  0.04 rad; the smallest lasting turn is about 0.04 rad (wz 0.1 for 1 s), shorter pulses mostly spring back, and the
  body keeps turning 0.05-0.09 rad for about 1.5 s after the last twist, so a loop on odometry yaw with |wz| of 0.1-0.3
  that stops within 0.02 rad ends within about 0.04 rad (re-check 2 s later); standing still, the heading does not
  drift.
source: introspected
calibrated_at: null
method: introspection
