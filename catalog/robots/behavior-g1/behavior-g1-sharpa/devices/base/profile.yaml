  units: si
  axes:
    vx:
      min: -0.5
      max: 0.5
    vy:
      min: -0.5
      max: 0.5
    wz:
      min: -0.5
      max: 0.5
posture: null
modes:
  drive:
    description: Drives on velocity commands.
    accepts:
    - velocity
    transitions: []
limits: strict
stop:
  behavior: halt
  affected_devices:
  - base
frames:
