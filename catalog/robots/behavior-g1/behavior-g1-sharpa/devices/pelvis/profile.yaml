name: pelvis
runtime:
  domain_id: 0
  nodes:
  - entry: links.py
    factory: create
  ready_timeout_s: 30
operations:
  joint_state:
    description: Measured pelvis_height, the pelvis above the floor in metres, with its vertical velocity, then
      the measured pelvis_pitch and pelvis_roll, the pelvis's tilt from the level base frame in radians (positive
      pitch leans forward) with their rates, and the world-clock acquisition stamp. The tilt is read-only; commands
      set pelvis_height alone. Do not infer motion completion from a sent command.
    transport: topic
    direction: output
    endpoint: /pelvis/joint_state
    type: sensor_msgs/msg/JointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  joint_target:
    description: Trajectory of pelvis_height in metres (0.20 to 0.78); pelvis_pitch and pelvis_roll may be
      named too and are ignored. Timed from receipt by strictly increasing
      time_from_start and finishing within 120 seconds; velocities, accelerations and effort must be empty. A
      zero header stamp selects now; a nonzero stamp must not start in the past. Points are absolute heights,
      linearly interpolated at the native control period. Replacement clears pending references. A height beyond
      0.20 to 0.78 is clipped to it; other invalid trajectories are ignored, so verify measured joint_state.
    transport: topic
    direction: input
    endpoint: /pelvis/joint_target
    type: trajectory_msgs/msg/JointTrajectory
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  stop:
    description: Hold the measured pelvis height.
    transport: service
    direction: input
    endpoint: /pelvis/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
loaded: false
meta:
  created_at: '2026-11-01T00:00:00Z'
  updated_at: '2026-11-01T00:00:00Z'
type: joint
description: G1 pelvis height, the base height command of GR00T's balance policy. One commanded prismatic joint,
  pelvis_height, the pelvis above the floor in metres; standing is 0.74, and the policy squats down to 0.20 and
  stands back up in one command. Lowering, the policy pitches the pelvis forward (measured about 6 degrees at a
  height of 0.62 m, 19 at 0.49, 24 to 27 at 0.45 and below; roll under 0.5) and the waist back by nearly as much
  (waist_pitch_joint about -0.4 rad below 0.45 m), keeping the torso within about 4 degrees of level. The pelvis also
  tilts while standing as the body balances the arms and the waist (back about 4 degrees with both arms reaching
  forward, about 9 with the waist also pitched 0.2 rad forward). joint_state reports that tilt as pelvis_pitch and
  pelvis_roll, and TF applies it. base/base and pelvis/base are level at the pelvis, pelvis/pelvis is the real,
  tilted pelvis, and the torso (hence arms, hands and head camera) mounts on pelvis/pelvis, so their TF poses hold
  in any posture. The hands reach lower as the pelvis goes down (the fingertips get within a few centimetres of the
  floor in a full squat, about 0.25 m in front of the pelvis). The legs walk only with the pelvis at 0.70 or higher,
  so stand up before walking. The measured height trails the command by a few centimetres; verify joint_state.
  Geometry is the sibling pelvis.urdf; its tip link floor is the floor point below the pelvis, and pelvis_pitch and
  pelvis_roll are fixed joints there (so that the device commands pelvis_height alone) that its TF publisher turns
  by the measured angles.
