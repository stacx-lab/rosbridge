name: head_camera
runtime:
  domain_id: 0
  nodes: []
  ready_timeout_s: 30
operations:
  image:
    description: RGB image measurements with encoding, dimensions, row stride and acquisition
      timestamp in the Image header. The frame_id identifies the calibrated optical frame;
      use its stamp for tf2 lookup. A new subscriber receives the current frame at once, also
      while the world is paused, then one per camera sample; reading never advances world
      time.
    transport: topic
    direction: output
    endpoint: /head_camera/image
    type: sensor_msgs/msg/Image
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  geometry:
    description: 'The active lens geometry: {} returns {streams: {color: descriptor}}, the
      profile''s width, height, projection and distortion with the optical frame and a calibration_id.'
    transport: service
    direction: input
    endpoint: /head_camera/geometry
    type: custom_interfaces/srv/Json
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  unproject:
    description: 'Pixels to optical rays through the lens: {stream, calibration_id, pixels:
      [[u, v], ...]} returns {rays: [[x, y, 1], ...]}, null where invalid; at most 8192 pixels.'
    transport: service
    direction: input
    endpoint: /head_camera/unproject
    type: custom_interfaces/srv/Json
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  project:
    description: 'Optical-frame points to pixels through the lens: {stream, calibration_id,
      points: [[X, Y, Z], ...]} with Z > 0 returns {pixels: [[u, v], ...]}, null where invalid;
      at most 8192 points.'
    transport: service
    direction: input
    endpoint: /head_camera/project
    type: custom_interfaces/srv/Json
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  camera_info:
    description: CameraInfo mirroring the profile, with K and P from color.projection, plumb_bob
      distortion from color.distortion, image size and optical frame. The camera's geometry
      is the profile's and the geometry services', not this topic's; intrinsics are not TF
      transforms.
    transport: topic
    direction: output
    endpoint: /head_camera/camera_info
    type: sensor_msgs/msg/CameraInfo
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
