name: head_camera
runtime:
  domain_id: 0
  nodes: []
  ready_timeout_s: 30
operations:
  image:
    description: RGB image measurements with encoding, dimensions, row stride and acquisition
      timestamp in the Image header. The frame_id identifies the calibrated optical frame;
      use its stamp for tf2 lookup. A new subscriber receives the current frame at once, also
      while the world is paused, then one per camera sample; reading never advances world
      time.
    transport: topic
    direction: output
    endpoint: /head_camera/image
    type: sensor_msgs/msg/Image
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  camera_info:
    description: CameraInfo mirroring the profile, with K and P from color.projection, zero
      plumb_bob distortion, image size and optical frame. Kinex reads camera geometry from
      the profile, not from this topic; intrinsics are not TF transforms.
    transport: topic
    direction: output
    endpoint: /head_camera/camera_info
    type: sensor_msgs/msg/CameraInfo
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
loaded: false
