name: left_hand
runtime:
  domain_id: 0
  nodes:
  - entry: links.py
    factory: create
  ready_timeout_s: 30
operations:
  joint_state:
    description: Measured positions of left_finger1_joint1, left_finger1_joint2, left_finger1_joint3,
      left_finger1_joint4, left_finger2_joint1, left_finger2_joint2, left_finger2_joint3,
      left_finger2_joint4, left_finger3_joint1, left_finger3_joint2, left_finger3_joint3,
      left_finger3_joint4, left_finger4_joint1, left_finger4_joint2, left_finger4_joint3,
      left_finger4_joint4, left_finger5_joint1, left_finger5_joint2, left_finger5_joint3,
      left_finger5_joint4 in radians with velocities and the world-clock acquisition stamp;
      do not infer motion completion from a sent command.
    transport: topic
    direction: output
    endpoint: /left_hand/joint_state
    type: sensor_msgs/msg/JointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  joint_target:
    description: Joint trajectory over all 20 hand joints in radians, timed from receipt by
      strictly increasing time_from_start and finishing within 120 seconds; velocities, accelerations
      and effort must be empty. A zero header stamp selects now; a nonzero stamp must not
      start in the past. Points are absolute native joint positions, linearly interpolated
      at the native control period. Replacement clears pending references; invalid trajectories
      are ignored, so verify measured joint_state.
    transport: topic
    direction: input
    endpoint: /left_hand/joint_target
    type: trajectory_msgs/msg/JointTrajectory
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  stop:
    description: Stop hand motion and hold the measured posture.
    transport: service
    direction: input
    endpoint: /left_hand/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
loaded: false
