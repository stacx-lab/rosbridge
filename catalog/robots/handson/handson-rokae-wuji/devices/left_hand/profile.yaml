type: joint
description: Wuji 20-joint left hand on the left_arm palm, finger-major from the thumb (finger1)
  to the little finger (finger5), as HandsOn's hand20 actions. Geometry is the sibling hand.urdf
  from the palm to the fingertips, with no single tip link; commands are absolute joint positions
  that the native controller slews toward, and contact is physical.
