name: left_arm
runtime:
  domain_id: 0
  nodes: []
  ready_timeout_s: 30
operations:
  joint_state:
    description: Measured positions of joint1_left, joint2_left, joint3_left, joint4_left,
      joint5_left, joint6_left, joint7_left in radians with velocities and the world-clock
      acquisition stamp; do not infer motion completion from a sent command.
    transport: topic
    direction: output
    endpoint: /left_arm/joint_state
    type: sensor_msgs/msg/JointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  pose_target:
    description: 'Trajectory of absolute palm poses in left_arm/base: joint_names [palm],
      one transform per point (metres, unit quaternion xyzw), time_from_start strictly increasing
      and within 120 seconds; a zero header stamp starts it now. It is interpolated from the
      current target. HandsOn''s own IK tracks it and may stop short of a pose. A new trajectory
      replaces the active one and an invalid one is ignored; verify the palm with pose_state.'
    transport: topic
    direction: input
    endpoint: /left_arm/pose_target
    type: trajectory_msgs/msg/MultiDOFJointTrajectory
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  pose_state:
    description: Measured palm pose in left_arm/base, stamped with joint_state.
    transport: topic
    direction: output
    endpoint: /left_arm/pose_state
    type: sensor_msgs/msg/MultiDOFJointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  stop:
    description: Stop arm motion and hold the measured posture.
    transport: service
    direction: input
    endpoint: /left_arm/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
loaded: false
