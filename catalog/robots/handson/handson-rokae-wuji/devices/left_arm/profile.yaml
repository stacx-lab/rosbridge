type: joint
description: ROKAE AR5 seven-joint left arm of the HandsOn station. Geometry is the sibling
  arm.urdf with palm (left_palm_link, the pose HandsOn's EEF52 actions command) as the tip
  link; measured links are on TF as left_arm/<link>, and helpers.joint_model('left_arm') computes
  FK/IK from it. Commands are absolute joint positions in place of HandsOn's palm-pose IK;
  the task's native controller settings and drives apply.
