left_arm:
  operations:
    joint_target: null
    move:
      description: 'Move the flange through poses in a straight line at the arm''s own pace:
        multi_dof_trajectory with joint_names [flange] and one transform per point, poses
        in left_arm/base (metres, unit quaternion xyzw). A time_from_start of zero moves at
        up to 1 m/s and 3.3 rad/s; a later time moves slower. The goal succeeds within 0.005
        m and 0.05 rad of the last pose, or within component_goal_tolerance (joint_name flange;
        component 4 in metres, 5 in radians). It is aborted where the arm is when the flange
        stalls, as against an obstacle, is not there 1 s (or goal_time_tolerance) after the
        motion should end, or has no IK solution. The result''s error_code is 0 reached, -4
        stalled, -5 late and -1 otherwise; error_string says why and how far from the goal.
        A goal advances no time: give it to the world wait''s goals. A newer goal or a stop
        ends it.'
      transport: action
      direction: input
      endpoint: /left_arm/move
      type: control_msgs/action/FollowJointTrajectory
      qos:
        depth: 1
        reliability: reliable
        durability: volatile
      timeout_s: 10
  description: ARX X5 six-joint left arm of the RoboDojo rig. Geometry is the sibling arm.urdf
    with flange (link6) as the tip link; its links are the frames left_arm/<link>. It takes
    move goals for its flange, which upstream's cuRobo IK turns into upstream's absolute joint
    positions (left_arm_joint_state of EvalEnv.take_action), a step every 0.04 s frame. Both
    arms use the native joint names joint1..joint6.
