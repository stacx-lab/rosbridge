left_camera:
  layout: null
  operations:
    depth:
      description: '16UC1 depth registered to image in millimetres along the optical axis;
        0 marks missing or out-of-range samples. Rendered with its image: same stamp and frame_id,
        so pair the two by stamp.'
      transport: topic
      direction: output
      endpoint: /left_camera/depth
      type: sensor_msgs/msg/Image
      qos:
        depth: 1
        reliability: reliable
        durability: volatile
      timeout_s: 10
  type: rgbd
  description: RGB-D camera (D435 model) on the left wrist, rendered by RoboDojo's tiled Isaac
    renderer with upstream's distance_to_image_plane depth. Image and registered depth calibration
    and the optical-frame mount on the left_arm flange are in the profile.
  depth:
    width: 640
    height: 480
    fps: null
    quantity: z
    scale_m_per_unit: 0.001
    invalid_value: 0
    valid_range_m:
      min: 0.001
      max: 10.0
    reliable_range_m:
      min: 0.001
      max: 10.0
    registration: color
