name: world
runtime:
  domain_id: 0
  observation: time
  nodes: []
  ready_timeout_s: 30
operations:
  time:
    description: Authoritative world clock
    transport: topic
    direction: output
    endpoint: /clock
    type: rosgraph_msgs/msg/Clock
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  wait:
    description: 'Advance or await duration_s of world time (finite and nonnegative). Zero
      is an observation barrier. Waits are sequential; one requested while another is pending
      is rejected. A terminal episode rejects further progression. At or after the end, a
      valid wait''s reply says so after its first words: "ok; the episode ended" (a wait whose
      last step was the end, or a zero wait), "episode ended during wait; the episode ended"
      (a wait the end cut short) or "episode is done; the episode ended" (a later wait), then
      "because the time limit was reached" or "because the simulator ended it" when that ended
      it, or "because the goal was reached" when a run launched to stop on success ended at
      its first success, the one benchmark result a reply exposes; time_s is the world time
      of the end. The reply''s message also names the device commands refused since the previous
      reply, with their reasons.'
    transport: service
    direction: input
    endpoint: /world/wait
    type: kinex_interfaces/srv/Wait
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 120
  stop:
    description: Cancel the pending wait.
    transport: service
    direction: input
    endpoint: /world/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
loaded: false
