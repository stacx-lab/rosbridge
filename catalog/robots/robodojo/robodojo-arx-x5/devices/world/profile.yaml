name: world
runtime:
  domain_id: 0
  observation: time
  nodes: []
  ready_timeout_s: 30
operations:
  time:
    description: Authoritative world clock
    transport: topic
    direction: output
    endpoint: /clock
    type: rosgraph_msgs/msg/Clock
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  wait:
    description: 'Advance or await duration_s of world time (finite and nonnegative). Zero
      is an observation barrier. Waits are sequential; one requested while another is pending
      is rejected. With goals, executing action goals, it also waits until all have finished;
      goals still executing goal_timeout_s into the wait are cancelled (zero: none). It ends
      once duration_s has passed and the goals have finished. A terminal episode rejects further
      progression. A device command refused during a wait, or before it and not yet reported,
      ends it there (success false; waited_s is how far it ran): the rest is never stepped,
      so it costs no budget. The reply''s message names the commands refused since the previous
      reply, with their reasons.'
    transport: service
    direction: input
    endpoint: /world/wait
    type: custom_interfaces/srv/Wait
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 120
  budget:
    description: 'The episode budget, published with every world step: data is [used_s, max_s],
      the seconds of world time the episode has used and is allowed, its control steps and
      step limit times the control period (max_s inf without a limit). Only a stepped run
      has a budget; a realtime run publishes [NaN, NaN].'
    transport: topic
    direction: output
    endpoint: /world/budget
    type: std_msgs/msg/Float64MultiArray
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  stop:
    description: Cancel the pending wait.
    transport: service
    direction: input
    endpoint: /world/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
loaded: true
