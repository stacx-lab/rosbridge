name: left_gripper
runtime:
  domain_id: 0
  observation: joint_state
  nodes:
  - entry: links.py
    factory: create
  ready_timeout_s: 30
operations:
  joint_state:
    description: Measured left_gripper, the native normalized gripper opening (0 closed, 1
      open), stamped at acquisition; Kinex publishes the URDF finger links from it.
    transport: topic
    direction: output
    endpoint: /left_gripper/joint_state
    type: sensor_msgs/msg/JointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  target:
    description: Native normalized opening (data) from 0 (closed) to 1 (open), the left_ee_joint_state
      of upstream's EvalEnv.take_action, which interpolates the fingers within each frame.
      A target persists until replaced or stopped; out-of-range targets are ignored, so verify
      joint_state.
    transport: topic
    direction: input
    endpoint: /left_gripper/target
    type: std_msgs/msg/Float64
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  stop:
    description: Hold the measured opening; fingers may settle briefly after the stop.
    transport: service
    direction: input
    endpoint: /left_gripper/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
loaded: false
meta:
  created_at: '2026-10-24T00:00:00Z'
  updated_at: '2026-10-24T00:00:00Z'
type: gripper
description: 'ARX X5 left parallel two-finger gripper on the left_arm flange. The grip joint
  left_gripper is upstream''s normalized ee value (0 closed, 1 open): finger targets are -0.01
  + 0.054 m per unit, so a closed command squeezes past the finger stop. The TCP is the pad
  center, +x approaching. A closed or stalled grip alone does not prove a successful grasp.'
source: introspected
calibrated_at: null
method: introspection
stop:
  behavior: hold
  affected_devices:
  - left_gripper
frames:
  base:
    translation_m:
    - 0.0
    - 0.0
    - 0.0
    rotation_xyzw:
    - 0.0
    - 0.0
    - 0.0
    - 1.0
    parent: left_arm:flange
  tcp:
    translation_m:
    - 0.15007
    - -2.0e-06
    - -0.00144
    rotation_xyzw:
    - 0.0
    - 0.0
    - 0.0
    - 1.0
    parent: left_gripper:base
model:
  format: urdf
  path: gripper.urdf
  base_link: base_link
grip:
  joint: left_gripper
  open: 1.0
  closed: 0.0
