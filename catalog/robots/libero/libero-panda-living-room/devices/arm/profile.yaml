name: arm
runtime:
  domain_id: 0
  nodes:
  - entry: links.py
    factory: create
  ready_timeout_s: 30
operations:
  joint_state:
    description: Measured joint positions with joint names and world-clock acquisition
      stamp. Positions are radians for the arm and metres for finger joints; do not
      infer motion completion from a sent command.
    transport: topic
    direction: output
    endpoint: /arm/joint_state
    type: sensor_msgs/msg/JointState
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  joint_target:
    description: Joint trajectory over all seven arm joints in radians, timed from
      receipt by strictly increasing time_from_start and finishing within 120 seconds;
      velocities, accelerations and effort must be empty. A zero header stamp selects
      now; a nonzero stamp must not start in the past. Replacement clears pending
      references; invalid trajectories are ignored, so verify measured joint_state.
    transport: topic
    direction: input
    endpoint: /arm/joint_target
    type: trajectory_msgs/msg/JointTrajectory
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  stop:
    description: Stop arm motion and hold the measured posture.
    transport: service
    direction: input
    endpoint: /arm/stop
    type: std_srvs/srv/Trigger
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
loaded: false
