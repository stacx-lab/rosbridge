name: camera_left
runtime:
  domain_id: 0
  nodes: []
  ready_timeout_s: 30
operations:
  image:
    description: RGB image measurements with encoding, dimensions, row stride and acquisition
      timestamp in the Image header. The frame_id identifies the calibrated optical frame;
      use its stamp for tf2 lookup. A new subscriber receives the current frame at once, also
      while the world is paused, then one per camera sample; reading never advances world
      time.
    transport: topic
    direction: output
    endpoint: /camera_left/image
    type: sensor_msgs/msg/Image
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  depth:
    description: '16UC1 depth registered to image in millimetres along the optical axis; 0
      marks missing or out-of-range samples. Rendered with its image: same stamp and frame_id,
      so pair the two by stamp.'
    transport: topic
    direction: output
    endpoint: /camera_left/depth
    type: sensor_msgs/msg/Image
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
  camera_info:
    description: Projection and distortion calibration for the image stream, including K,
      D, image size and optical frame. Use the declared distortion model and raw/rectified
      image space when projecting pixels; intrinsics are not TF transforms.
    transport: topic
    direction: output
    endpoint: /camera_left/camera_info
    type: sensor_msgs/msg/CameraInfo
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
