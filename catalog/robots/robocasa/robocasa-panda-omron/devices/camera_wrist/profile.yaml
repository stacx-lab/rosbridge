name: camera_wrist
runtime:
  domain_id: 0
  nodes: []
  ready_timeout_s: 30
operations:
  image:
    description: RGB image measurements with encoding, dimensions, row stride and acquisition
      timestamp in the Image header. The frame_id identifies the calibrated optical frame;
      use its stamp for tf2 lookup. Subscription does not advance world time.
    transport: topic
    direction: output
    endpoint: /camera_wrist/image
    type: sensor_msgs/msg/Image
    qos:
      depth: 1
      reliability: best_effort
      durability: volatile
    timeout_s: 10
  depth:
    description: 16UC1 depth registered to image in millimetres along the optical axis; 0
      marks missing or out-of-range samples. Same stamp and frame_id as the paired image.
    transport: topic
    direction: output
    endpoint: /camera_wrist/depth
    type: sensor_msgs/msg/Image
    qos:
      depth: 1
      reliability: best_effort
      durability: volatile
    timeout_s: 10
  camera_info:
    description: Projection and distortion calibration for the image stream, including K,
      D, image size and optical frame. Use the declared distortion model and raw/rectified
      image space when projecting pixels; intrinsics are not TF transforms.
    transport: topic
    direction: output
    endpoint: /camera_wrist/camera_info
    type: sensor_msgs/msg/CameraInfo
    qos:
      depth: 1
      reliability: reliable
      durability: transient_local
    timeout_s: 10
  capture:
    description: Return the current image and registered depth in CaptureRGBD.response image
      and depth_image from one acquisition without advancing world time. Preserve the header
      acquisition stamp and frame_id.
    transport: service
    direction: input
    endpoint: /camera_wrist/capture
    type: kinex_interfaces/srv/CaptureRGBD
    qos:
      depth: 1
      reliability: reliable
      durability: volatile
    timeout_s: 10
