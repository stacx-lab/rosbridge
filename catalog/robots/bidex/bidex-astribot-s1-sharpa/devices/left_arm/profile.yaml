type: joint
description: Astribot S1 seven-joint left arm of the BiDex-100 station. Geometry is the sibling
  arm.urdf with flange (astribot_arm_left_tool_link, the body that carries the hand and the
  wrist camera) as the tip link; measured links are on TF as left_arm/<link>, and helpers.joint_model('left_arm')
  computes FK/IK from it. Commands are absolute joint positions, BiDex-100's arm_joint_position,
  through the native position servos.
