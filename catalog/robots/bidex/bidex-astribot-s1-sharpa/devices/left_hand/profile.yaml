type: joint
description: Sharpa Wave 22-joint left hand on the left_arm flange, thumb first, then the
  index, middle, ring and little fingers, as BiDex-100's dex_joint_position. Geometry is the
  sibling hand.urdf from the palm (left_hand_C_MC) to the fingertips, with no single tip link;
  commands are absolute joint positions through the native position servos, and contact is
  physical. Joint limits are soft, so measured joints can read past their ranges; clip targets
  to the URDF limits, since rosbridge refuses one more than 0.001 outside them.
